name: Release

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing release tag to attach the build to (e.g. v1.0.0)'
        required: true
        default: 'v1.0.0'

permissions:
  contents: write

jobs:
  build-windows:
    name: Build and attach Windows portable ZIP
    runs-on: windows-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.release.tag_name || github.event.inputs.tag }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm install

      - name: Build portable Windows app
        run: npm run build

      - name: Verify build output
        shell: pwsh
        run: |
          $exe = "dist/win-unpacked/GM-Time-Organizer.exe"
          if (-not (Test-Path $exe)) {
            Write-Error "Build did not produce $exe"
            exit 1
          }
          $sizeMB = [math]::Round((Get-Item $exe).Length / 1MB, 1)
          Write-Host "Built $exe ($sizeMB MB)"
          Get-ChildItem "dist/win-unpacked" | Select-Object Name, Length | Format-Table -AutoSize

      - name: Package as portable ZIP
        shell: pwsh
        run: |
          $tag = "${{ github.event.release.tag_name || github.event.inputs.tag }}"
          $zipName = "GM-Time-Organizer-$tag-windows-x64.zip"
          Compress-Archive -Path "dist/win-unpacked/*" -DestinationPath $zipName -CompressionLevel Optimal
          $sizeMB = [math]::Round((Get-Item $zipName).Length / 1MB, 1)
          Write-Host "Created $zipName ($sizeMB MB)"

      - name: Attach ZIP to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.release.tag_name || github.event.inputs.tag }}
          files: GM-Time-Organizer-*-windows-x64.zip
          fail_on_unmatched_files: true
          draft: false
          prerelease: false
