name: Release

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing release tag to attach the build to (e.g. v1.0.1)'
        required: true
        default: 'v1.0.1'

permissions:
  contents: write

jobs:
  build-windows:
    name: Build and attach Windows portable ZIP
    runs-on: windows-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.release.tag_name || github.event.inputs.tag }}

      - name: Print checked-out commit
        shell: pwsh
        run: |
          git log -1 --pretty=format:"%h %s"
          Write-Host ""
          Write-Host "productName in package.json:"
          $pkg = Get-Content package.json -Raw | ConvertFrom-Json
          Write-Host "  $($pkg.build.productName)"

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm install

      - name: Build portable Windows app
        run: npm run build

      - name: Verify build output (name-agnostic)
        shell: pwsh
        run: |
          $exeDir = "dist/win-unpacked"
          if (-not (Test-Path $exeDir)) {
            Write-Error "Build did not produce $exeDir"
            exit 1
          }
          Write-Host "Contents of $exeDir :"
          Get-ChildItem $exeDir | Select-Object Name, Length | Format-Table -AutoSize

          $exes = @(Get-ChildItem "$exeDir/*.exe" -ErrorAction SilentlyContinue)
          if ($exes.Count -eq 0) {
            Write-Error "No .exe found in $exeDir"
            exit 1
          }
          Write-Host "Found $($exes.Count) exe(s):"
          $exes | ForEach-Object { Write-Host "  $($_.Name) ($([math]::Round($_.Length/1MB,1)) MB)" }

      - name: Package as portable ZIP
        shell: pwsh
        run: |
          $tag = "${{ github.event.release.tag_name || github.event.inputs.tag }}"
          $zipName = "GM-Time-Organizer-$tag-windows-x64.zip"
          Compress-Archive -Path "dist/win-unpacked/*" -DestinationPath $zipName -CompressionLevel Optimal
          $sizeMB = [math]::Round((Get-Item $zipName).Length / 1MB, 1)
          Write-Host "Created $zipName ($sizeMB MB)"

      - name: Attach ZIP to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.release.tag_name || github.event.inputs.tag }}
          files: GM-Time-Organizer-*-windows-x64.zip
          fail_on_unmatched_files: true
          draft: false
          prerelease: false
